name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format gate
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Python tests
        run: python3 -m unittest discover -s tools/ai-triage/tests -v
      - name: Vulnerability lifecycle tests
        run: |
          python3 scripts/vulnerability_gate.py security/findings/before.json --expect-block
          python3 scripts/vulnerability_gate.py security/findings/current.json
          python3 scripts/verify_remediation.py security/findings/before.json security/findings/current.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go, actions
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect committed secrets
        uses: docker://zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source=/github/workspace --redact --no-banner --exit-code=1

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only

  infrastructure:
    name: Terraform and IaC policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Terraform format gate
        run: terraform fmt -check -recursive terraform
      - name: Terraform validation
        run: |
          for environment in dev staging production; do
            terraform -chdir="terraform/environments/${environment}" init -backend=false -input=false
            terraform -chdir="terraform/environments/${environment}" validate
          done
      - name: Trivy IaC gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
          version: v0.74.0

  image:
    name: Image, filesystem and SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable candidate
        run: docker build --pull --tag portfolio:${{ github.sha }} .
      - name: Trivy filesystem gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
          version: v0.74.0
      - name: Trivy image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true
          version: v0.74.0
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: portfolio:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: portfolio:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sboms-${{ github.sha }}
          path: sbom.*.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Fail-closed release gate
    if: always()
    needs: [test, codeql, secrets, dependencies, infrastructure, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required outcomes
        env:
          TEST: ${{ needs.test.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          test "$TEST" = success
          test "$CODEQL" = success
          test "$SECRETS" = success
          test "$INFRASTRUCTURE" = success
          test "$IMAGE" = success
          test "$DEPENDENCIES" = success -o "$DEPENDENCIES" = skipped
